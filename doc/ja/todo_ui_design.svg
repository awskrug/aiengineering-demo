<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="20" width="560" height="360" rx="16" fill="#f9f9f9" stroke="#bbb" stroke-width="2"/>
  <!-- Header -->
  <rect x="20" y="20" width="560" height="50" rx="8" fill="#4F8EF7" />
  <text x="300" y="50" text-anchor="middle" font-size="22" fill="white" font-family="sans-serif">TODOアプリ</text>
  <!-- Add Todo Form -->
  <rect x="40" y="85" width="520" height="40" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="60" y="110" font-size="15" fill="#888" font-family="sans-serif">+ 新しいTODOを入力...</text>
  <rect x="500" y="92" width="50" height="26" rx="5" fill="#4F8EF7" />
  <text x="525" y="110" text-anchor="middle" font-size="15" fill="white" font-family="sans-serif">追加</text>
  <!-- Filter/Search Bar -->
  <rect x="40" y="135" width="520" height="30" rx="6" fill="#f1f3f4" stroke="#ccc"/>
  <text x="60" y="155" font-size="13" fill="#888" font-family="sans-serif">検索/フィルタ...</text>
  <!-- Todo List -->
  <g>
    <rect x="40" y="175" width="520" height="40" rx="6" fill="#fff" stroke="#ccc"/>
    <circle cx="60" cy="195" r="10" fill="#4F8EF7" />
    <text x="80" y="200" font-size="15" fill="#333" font-family="sans-serif">TODO項目1</text>
    <rect x="480" y="185" width="30" height="20" rx="4" fill="#eee" stroke="#bbb"/>
    <text x="495" y="200" font-size="13" fill="#4F8EF7" font-family="sans-serif">編集</text>
    <rect x="515" y="185" width="30" height="20" rx="4" fill="#eee" stroke="#bbb"/>
    <text x="530" y="200" font-size="13" fill="#F76C5E" font-family="sans-serif">削除</text>
  </g>
  <g>
    <rect x="40" y="220" width="520" height="40" rx="6" fill="#fff" stroke="#ccc"/>
    <circle cx="60" cy="240" r="10" fill="#bbb" />
    <text x="80" y="245" font-size="15" fill="#999" font-family="sans-serif">TODO項目2（完了）</text>
    <rect x="480" y="230" width="30" height="20" rx="4" fill="#eee" stroke="#bbb"/>
    <text x="495" y="245" font-size="13" fill="#4F8EF7" font-family="sans-serif">編集</text>
    <rect x="515" y="230" width="30" height="20" rx="4" fill="#eee" stroke="#bbb"/>
    <text x="530" y="245" font-size="13" fill="#F76C5E" font-family="sans-serif">削除</text>
  </g>
  <!-- Footer -->
  <rect x="20" y="350" width="560" height="30" rx="8" fill="#eaeaea" />
  <text x="300" y="370" text-anchor="middle" font-size="13" fill="#888" font-family="sans-serif">© 2025 TODOアプリ設計デモ</text>
</svg>
